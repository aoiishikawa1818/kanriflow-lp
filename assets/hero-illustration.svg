<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Hero illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"></stop>
      <stop offset="1" stop-color="#ECFEFF"></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1D4ED8"></stop>
      <stop offset="1" stop-color="#0EA5E9"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.18"></feDropShadow>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"></rect>

  <!-- blobs -->
  <circle cx="180" cy="170" r="120" fill="#1D4ED8" opacity="0.08"></circle>
  <circle cx="1040" cy="140" r="160" fill="#0EA5E9" opacity="0.10"></circle>
  <circle cx="980" cy="640" r="220" fill="#22C55E" opacity="0.07"></circle>

  <!-- laptop -->
  <g transform="translate(250,160)" filter="url(#shadow)">
    <rect x="0" y="0" width="700" height="420" rx="28" fill="#0F172A" opacity="0.92"></rect>
    <rect x="24" y="24" width="652" height="360" rx="18" fill="#FFFFFF"></rect>
    <rect x="24" y="24" width="652" height="64" rx="18" fill="#F1F5F9"></rect>

    <!-- navbar dots -->
    <circle cx="56" cy="56" r="8" fill="#EF4444" opacity="0.9"></circle>
    <circle cx="82" cy="56" r="8" fill="#F59E0B" opacity="0.9"></circle>
    <circle cx="108" cy="56" r="8" fill="#22C55E" opacity="0.9"></circle>

    <!-- content -->
    <rect x="56" y="118" width="260" height="34" rx="10" fill="#E2E8F0"></rect>
    <rect x="56" y="168" width="420" height="18" rx="9" fill="#E2E8F0" opacity="0.9"></rect>
    <rect x="56" y="200" width="380" height="18" rx="9" fill="#E2E8F0" opacity="0.75"></rect>

    <!-- cards -->
    <g transform="translate(56,250)">
      <rect x="0" y="0" width="190" height="108" rx="18" fill="#F8FAFC" stroke="#E2E8F0"></rect>
      <rect x="16" y="18" width="120" height="14" rx="7" fill="#CBD5E1"></rect>
      <rect x="16" y="44" width="150" height="12" rx="6" fill="#E2E8F0"></rect>
      <rect x="16" y="66" width="110" height="12" rx="6" fill="#E2E8F0"></rect>
      <path d="M160 78l8 8 14-18" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>

    <g transform="translate(266,250)">
      <rect x="0" y="0" width="190" height="108" rx="18" fill="#F8FAFC" stroke="#E2E8F0"></rect>
      <rect x="16" y="18" width="110" height="14" rx="7" fill="#CBD5E1"></rect>
      <rect x="16" y="44" width="150" height="12" rx="6" fill="#E2E8F0"></rect>
      <rect x="16" y="66" width="130" height="12" rx="6" fill="#E2E8F0"></rect>
      <path d="M160 78l8 8 14-18" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>

    <g transform="translate(476,250)">
      <rect x="0" y="0" width="190" height="108" rx="18" fill="#F8FAFC" stroke="#E2E8F0"></rect>
      <rect x="16" y="18" width="130" height="14" rx="7" fill="#CBD5E1"></rect>
      <rect x="16" y="44" width="150" height="12" rx="6" fill="#E2E8F0"></rect>
      <rect x="16" y="66" width="100" height="12" rx="6" fill="#E2E8F0"></rect>
      <path d="M160 78l8 8 14-18" fill="none" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>

    <!-- base -->
    <rect x="-60" y="420" width="820" height="34" rx="17" fill="#0F172A" opacity="0.86"></rect>
  </g>

  <!-- accent line -->
  <rect x="250" y="632" width="700" height="10" rx="5" fill="url(#accent)" opacity="0.9"></rect>
</svg>
