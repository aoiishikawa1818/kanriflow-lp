<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="KanriFlow logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"></stop>
      <stop offset="1" stop-color="#0EA5E9"></stop>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18"></feDropShadow>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(40,40)" filter="url(#s)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#g)"></rect>
    <!-- checklist -->
    <rect x="46" y="44" width="78" height="92" rx="16" fill="#FFFFFF" opacity="0.95"></rect>
    <path d="M64 74l10 10 18-22" fill="none" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M64 104l10 10 18-22" fill="none" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <line x1="88" y1="90" x2="114" y2="90" stroke="#111827" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"></line>
    <line x1="88" y1="120" x2="114" y2="120" stroke="#111827" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"></line>
  </g>

  <!-- Wordmark -->
  <g transform="translate(230,80)">
    <text x="0" y="52" font-size="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif" font-weight="800" fill="#0F172A">Kanri</text>
    <text x="170" y="52" font-size="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif" font-weight="800" fill="#1D4ED8">Flow</text>
    <text x="0" y="92" font-size="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans JP', sans-serif" font-weight="500" fill="#334155" opacity="0.95">
      Projects &amp; Tasks, clearly.
    </text>
  </g>
</svg>
